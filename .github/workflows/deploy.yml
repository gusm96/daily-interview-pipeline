name: Build and Deploy to GCP

on:
  push:
    branches:
      - main
    # 배포에 영향을 주는 파일만 나열한다(화이트리스트).
    # 봇은 매일 07:00 루틴 A에서 CS/·Java/·SpringBoot/·Database/·Etc/의 문제 파일과
    # 카테고리 인덱스, README.md를 main에 커밋한다. 이건 콘텐츠일 뿐 함수 코드가 아니므로
    # 예전 paths-ignore(README.md·docs/**만 제외) 방식에서는 매일 불필요한 재배포가 돌았다.
    # 제외 목록이 아니라 포함 목록으로 두면 카테고리가 새로 생겨도 자동으로 안전하다.
    # state.json은 런타임에 GitHub API로 읽으므로(handlers.py) 재배포가 필요 없다.
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  # 화이트리스트에서 빠진 파일 때문에 배포가 필요한 경우를 위한 수동 실행구.
  workflow_dispatch:

env:
  PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}" # GCP 프로젝트 ID를 GitHub Secrets에서 불러와 사용합니다.
  REGION: "asia-northeast3"         # 리전 (예: 서울 리전)
  SERVICE_NAME: "daily-interview-bot"


jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation 인증을 위해 필요

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v5

    # 1. Google Cloud 인증 (Workload Identity Federation)
    # 보안 정책상 서비스 계정 키 생성이 차단되므로, 보안이 우수하고 키가 필요 없는 WIF 인증을 사용합니다.
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'


    # =========================================================================
    # 선택지 A: Google Cloud Run 배포 (비활성화)
    # =========================================================================
    # 2. Artifact Registry 로그인
    # - name: Log in to Google Artifact Registry
    #   run: |
    #     gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
    # 
    # 3. Docker Image 빌드 및 푸시 (Artifact Registry 전송)
    # - name: Build and Push Docker Image
    #   run: |
    #     IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
    #     docker build -t $IMAGE_TAG .
    #     docker push $IMAGE_TAG
    #     echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
    # 
    # 4. Cloud Run 배포 (Serverless Container 구동)
    # - name: Deploy to Cloud Run
    #   uses: google-github-actions/deploy-cloudrun@v2
    #   with:
    #     service: ${{ env.SERVICE_NAME }}
    #     region: ${{ env.REGION }}
    #     image: ${{ env.IMAGE_TAG }}

    # =========================================================================
    # 선택지 B: Google Cloud Functions 배포 (활성화)
    # =========================================================================
    - name: Deploy to Cloud Functions
      uses: google-github-actions/deploy-cloud-functions@v4
      with:
        name: ${{ env.SERVICE_NAME }}
        service_timeout: 300s

        runtime: python311
        entry_point: daily_interview_bot
        region: ${{ env.REGION }}
        project_id: ${{ env.PROJECT_ID }}
        # GitHub Secrets로부터 환경 변수를 주입합니다. (v3 입력명: environment_variables)
        environment_variables: |
          GITHUB_TOKEN=${{ secrets.CUSTOM_GITHUB_TOKEN }}
          REPO_OWNER=${{ github.repository_owner }}
          REPO_NAME=${{ github.event.repository.name }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_BOT_USER_ID=${{ secrets.SLACK_BOT_USER_ID }}
          GEMINI_MODEL=gemini-2.5-flash
